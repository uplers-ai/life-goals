<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Life Goals 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, season strip on top, sticky tab bar, quest cards grouped by category. Sibling of the Thank you Board. */
:root{
  --paper:#F3F4F0; --card:#FFFFFF; --card-2:#F8F9F6;
  --ink:#191B18; --ink-2:#575B54; --ink-3:#878B82;
  --line:#DFE2DA; --line-2:#C9CDC2;
  --accent:#1E6E55; --accent-soft:#DDEFE7; --accent-ring:rgba(30,110,85,.22);
  --health:#2F7D5B; --health-soft:#E0F0E7;
  --exp:#2C64A6;    --exp-soft:#E1EBF7;
  --learn:#7046A8;  --learn-soft:#ECE4F6;
  --stretch:#B0620E;--stretch-soft:#F8E9D6;
  --warn:#A3540C;
  --shadow:0 1px 2px rgba(25,27,24,.05),0 8px 24px -14px rgba(25,27,24,.20);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161816; --card:#202320; --card-2:#272A27;
    --ink:#EEF0EA; --ink-2:#AAAFA5; --ink-3:#80857C;
    --line:#333731; --line-2:#444940;
    --accent:#5CC59E; --accent-soft:#1D3229; --accent-ring:rgba(92,197,158,.25);
    --health:#6CC796; --health-soft:#1E3227;
    --exp:#78A8E3; --exp-soft:#1C2939;
    --learn:#B593E6; --learn-soft:#2B2338;
    --stretch:#E7A55C; --stretch-soft:#382A1A;
    --warn:#E3A35D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161816; --card:#202320; --card-2:#272A27;
  --ink:#EEF0EA; --ink-2:#AAAFA5; --ink-3:#80857C;
  --line:#333731; --line-2:#444940;
  --accent:#5CC59E; --accent-soft:#1D3229; --accent-ring:rgba(92,197,158,.25);
  --health:#6CC796; --health-soft:#1E3227;
  --exp:#78A8E3; --exp-soft:#1C2939;
  --learn:#B593E6; --learn-soft:#2B2338;
  --stretch:#E7A55C; --stretch-soft:#382A1A;
  --warn:#E3A35D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}

/* masthead */
.mast{padding-block:32px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:32px;font-weight:800;line-height:1.02}
.brand .tagline{font-size:16px;color:var(--ink-2);margin-top:6px;max-width:46ch}
.brand .sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.whoami{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 6px;box-shadow:var(--shadow)}
.whoami .nm{font-weight:600;font-size:14px}
.whoami button{background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink-2)}

/* season strip */
.season{padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px}
.season-top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between}
.season-top .big{font-family:var(--display);font-size:20px;font-weight:800}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.mseg.gone{background:transparent;border-style:dashed;opacity:.55}
.mseg.gone span{color:var(--ink-3)}
.mseg.live{border-color:var(--accent)}
.mseg.live span{color:var(--accent);font-weight:600}
@media (max-width:520px){.mseg span{font-size:9.5px}}
.mseg{position:relative;height:30px;border-radius:5px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.mseg .fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft)}
.mseg span{position:relative;display:block;text-align:center;line-height:28px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.mseg.past span{color:var(--accent);font-weight:600}

/* tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding-block:12px;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);max-width:100%}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.section{padding-block:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{font-size:22px;font-weight:800}

/* avatar */
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.av.sm{width:24px;height:24px;font-size:9.5px}
.av.lg{width:40px;height:40px;font-size:14px}

/* gate */
.gate{margin-top:20px;padding:30px 26px}
.gate h2{font-size:26px;font-weight:800;margin-bottom:6px}
.gate p{color:var(--ink-2);max-width:60ch;margin-bottom:20px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.namegrid button{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;text-align:left;font-weight:500;display:flex;align-items:center;gap:10px}
.namegrid button:hover{border-color:var(--accent);background:var(--accent-soft)}

/* category chip */
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.cat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-health{color:var(--health);background:var(--health-soft)}
.c-exp{color:var(--exp);background:var(--exp-soft)}
.c-learn{color:var(--learn);background:var(--learn-soft)}
.c-stretch{color:var(--stretch);background:var(--stretch-soft)}

/* board */
.group{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.group-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.group-head .gn{font-family:var(--display);font-size:18px;font-weight:800}
.group-head .gc{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.quest{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:15px;display:flex;flex-direction:column;gap:11px;min-width:0}
.quest.mine{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.q-top{display:flex;gap:10px;align-items:center}
.q-who{font-weight:600;font-size:14.5px;line-height:1.2}
.q-buddy{font-size:12px;color:var(--ink-3)}
.q-title{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.q-why{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.meter{display:flex;flex-direction:column;gap:5px}
.track{height:8px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden;position:relative}
.track .f{position:absolute;inset:0 auto 0 0;border-radius:99px}
.track .pace{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);opacity:.6}
.meter-row{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.meter-row b{color:var(--ink);font-weight:600}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.wk{height:12px;border-radius:2px;background:var(--card-2);border:1px solid var(--line)}
.wk.on{border:0}
.wk.future{opacity:.35}
.q-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cheer{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card-2);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.cheer:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.cheer.done{background:var(--accent-soft);border-color:transparent;color:var(--accent);cursor:default}
.cheer .n{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.last{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.waiting{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
.empty{padding:26px;text-align:left;display:flex;flex-direction:column;gap:10px}
.empty h3{font-size:19px}

/* forms */
.form{padding:22px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--card-2);font-size:14.5px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--card);outline:none}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:120px 1fr;gap:12px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.catopt{border:1.5px solid var(--line);background:var(--card-2);border-radius:var(--r-m);padding:12px 13px;text-align:left;display:flex;flex-direction:column;gap:6px}
.catopt .cn{font-weight:600;font-size:15px}
.catopt .cd{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.catopt[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.idea{border:1px dashed var(--line-2);background:transparent;border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
.idea:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--r-s);padding:9px 16px;font-weight:600;font-size:14px}
:root[data-theme="dark"] .btn{color:#0f1a15}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0f1a15}}
.btn:disabled{background:var(--card-2);border-color:var(--line);color:var(--ink-3);cursor:not-allowed}
.ghost{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 13px;font-size:13px;color:var(--ink-2)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;color:var(--ink-2)}
.msg.err{color:var(--warn)}

/* my quest */
.mine-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}
@media (max-width:820px){.mine-grid{grid-template-columns:1fr}}
.log-list{display:flex;flex-direction:column}
.log{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:10px 2px;border-top:1px solid var(--line);align-items:baseline}
.log:first-child{border-top:0}
.log .d{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.log .a{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.log .t{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere;min-width:0}
.linkbtn{background:none;border:0;padding:0;font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}
.linkbtn:hover{color:var(--warn)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

/* standings */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:9px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 7px;white-space:nowrap}
.tag.fin{color:var(--accent);background:var(--accent-soft)}
.tag.host{color:var(--ink-2);border:1px solid var(--line-2)}
.buddies{display:flex;flex-wrap:wrap;gap:6px}
.bchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:3px 11px 3px 3px;font-size:13px;color:var(--ink-2)}
.bchip:hover{border-color:var(--accent)}
.bchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.bchip.none{padding:5px 11px}
.q-buddy .linkbtn{font-size:12px;color:var(--accent)}
.q-buddy select{font-size:12px;padding:2px 4px;border-radius:5px;border:1px solid var(--line-2);background:var(--card-2);max-width:170px}
.prize{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard.me{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.pcard .pn{font-weight:600;font-size:15px}
.pcard .pa{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;overflow-wrap:anywhere}
.skill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.skill .x{border:0;background:none;padding:0 0 0 2px;color:inherit;opacity:.6;font-size:14px;line-height:1}
.skill .x:hover{opacity:1}
.skill.hit{box-shadow:0 0 0 2px currentColor}
.addskill{display:flex;gap:8px;flex-wrap:wrap}
.addskill input,.addskill select,.pfield{padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--card-2);font-size:14px;min-width:0}
.addskill input{flex:1 1 180px}
.pfield{width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input{flex:1 1 220px;max-width:340px;padding:9px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:14px}
.bchip .bk{font-size:11.5px;color:var(--accent);font-weight:500}
.composer{padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--card-2);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--display);font-size:16px}
.preview{max-width:100%;max-height:280px;border-radius:var(--r-s);display:block}
.wall{columns:3 260px;column-gap:12px}
.post{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:12px;overflow:hidden;display:flex;flex-direction:column}
.post .media{background:var(--card-2);display:block;width:100%;max-height:520px;object-fit:cover}
.post video.media{object-fit:contain;background:#000}
.post .missing{padding:30px 14px;text-align:center;font-size:13px;color:var(--ink-3);background:var(--card-2)}
.post .pb{padding:12px 13px 13px;display:flex;flex-direction:column;gap:8px}
.post .cap{font-size:14px;overflow-wrap:anywhere}
.post .pmeta{display:flex;align-items:center;gap:8px;font-size:13px}
.post .pmeta .when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.post .qt{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.post .pf{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.like{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card-2);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.like:hover{border-color:#C8424F;color:#C8424F}
.like.on{background:#FBE6E8;border-color:transparent;color:#B83240}
:root[data-theme="dark"] .like.on{background:#3A1E22;color:#F08A95}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .like.on{background:#3A1E22;color:#F08A95}}
.like svg{width:15px;height:15px}
.like .n{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.likers{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.progressbar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--accent);width:40%;animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:60%}}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:22px}
.reward{padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px}
.reward.big{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--card) 70%)}
.reward .amt{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.reward.big .amt{color:var(--accent)}

/* ---------- dates ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dnum(s){ var p=s.split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000; }
function fmtDate(s){ var p=s.split("-"); return (+p[2])+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]; }
function weekOf(s){ return Math.min(WEEKS-1, Math.floor((dnum(s)-dnum(SEASON_START))/7)); }
function seasonState(t){ if (dnum(t)<dnum(SEASON_START)) return "pre"; if (dnum(t)>dnum(SEASON_END)) return "over"; return "live"; }
function weeksElapsed(t){ var st=seasonState(t); if (st==="pre") return 0; if (st==="over") return WEEKS; return weekOf(t)+1; }

/* ---------- utils ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function initials(n){ var p=n.split(" "); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function av(p,size){ return '<span class="av '+(size||"")+'" style="background:hsl('+p.hue+' 45% 46%)">'+esc(initials(p.name))+'</span>'; }
function fmtNum(n){ return (Math.round(n*10)/10).toLocaleString("en-IN"); }
function first(p){ return p.name.split(" ")[0]; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
var toastT;
function toast(t){ var el=document.getElementById("toast"); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){el.hidden=true;},2400); }
function val(id){ var e=document.getElementById(id); return e? e.value : ""; }

/* ---------- firebase ---------- */
/* Config lives in firebase-config.js. Without it the board runs in preview mode on this device only. */
var FB=null;
try{ if (window.firebase && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey) FB=firebase.initializeApp(window.FIREBASE_CONFIG); }catch(e){ FB=null; }

/* Wall uploads go to Firebase Storage under wall/. */
var Assets = FB ? {
  upload:function(blob,kind){
    var ext=((blob.type||"").split("/")[1]||(kind==="video"?"mp4":"jpg")).replace(/[^a-z0-9]/gi,"").slice(0,5);
    var path="wall/"+S.me+"_"+Date.now()+"."+ext;
    return FB.storage().ref(path).put(blob,{contentType:blob.type||(kind==="video"?"video/mp4":"image/jpeg")})
      .then(function(snap){ return snap.ref.getDownloadURL(); })
      .then(function(url){ return {id:path,url:url}; })
      ["catch"](function(e){
        var c=e&&e.code;
        throw {code: c==="storage/unauthorized" ? "not_granted" : c==="storage/quota-exceeded" ? "quota_or_state" : c==="storage/retry-limit-exceeded" ? "rate_limited" : "failed"};
      });
  },
  "delete":function(path){ return FB.storage().ref(path)["delete"](); }
} : null;

/* ---------- data layer: shared db, local fallback ---------- */
var DB=(function(){
  var cdb=null, kind="connecting", local={}, watchers={};
  function loadLocal(){ try{ local=JSON.parse(localStorage.getItem("sq-local-2")||"{}")||{}; }catch(e){ local={}; } }
  function saveLocal(){ try{ localStorage.setItem("sq-local-2",JSON.stringify(local)); }catch(e){} }
  function rows(col){ var o=local[col]||{}; return Object.keys(o).map(function(id){ var r=Object.assign({},o[id]); r.id=id; return r; }); }
  function notify(col){ (watchers[col]||[]).forEach(function(cb){ cb(rows(col)); }); }
  return {
    kind:function(){ return kind; },
    start:function(){
      if (FB){ cdb=FB.firestore(); kind="shared"; return Promise.resolve(kind); }
      loadLocal(); kind="local"; return Promise.resolve(kind);
    },
    watch:function(col,cb){
      if (kind==="shared"){
        cdb.collection(col).onSnapshot(function(snap){
          cb(snap.docs.map(function(d){ var r=Object.assign({},d.data()||{}); r.id=d.id; return r; }));
        }, function(){ setStatus("Live updates paused. Reload to reconnect."); });
      } else { (watchers[col]=watchers[col]||[]).push(cb); cb(rows(col)); }
    },
    set:function(col,id,data){
      if (kind==="shared") return cdb.doc(col+"/"+id).set(data);
      local[col]=local[col]||{}; local[col][id]=data; saveLocal(); notify(col); return Promise.resolve();
    },
    del:function(col,id){
      if (kind==="shared") return cdb.doc(col+"/"+id)["delete"]();
      if (local[col]) delete local[col][id]; saveLocal(); notify(col); return Promise.resolve();
    }
  };
})();

/* ---------- state ---------- */
var S={ me:null, tab:"board", quests:{}, logs:[], cheers:[], profiles:{}, pfilter:"", pcat:"", posts:[], likes:[], finishes:{}, wcat:"", wsort:"new", assets:undefined, upload:null, loaded:{quests:false,logs:false,cheers:false,profiles:false,posts:false,finishes:false} };
var TODAY=todayStr();
function setStatus(t){ document.getElementById("status").textContent=t||""; }
function questList(){ return Object.keys(S.quests).map(function(k){ return S.quests[k]; }); }
function myQuests(){ return questList().filter(function(q){ return q.person===S.me; }).sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); }); }

/* Progress, 0..1, by quest type.
   weekly: each week counts up to the weekly target; 100% = target hit in all 8 weeks.
   total:  amount logged / target.
   steps:  steps ticked / steps. */
function questStats(q){
  var logs=S.logs.filter(function(l){ return l.quest===q.id; });
  var perWeek={}, total=0, last=null, done={};
  logs.forEach(function(l){
    if (l.step!=null){ done[l.step]=l; }
    else {
      var a=+l.amount||0; total+=a;
      var w=weekOf(l.date); if (w>=0) perWeek[w]=(perWeek[w]||0)+a;
    }
    var w2=weekOf(l.date); if (w2>=0 && l.step==null) perWeek[w2]=perWeek[w2]||0;
    if (!last || l.date>last.date || (l.date===last.date && (l.at||0)>(last.at||0))) last=l;
  });
  var activeWeeks={}; logs.forEach(function(l){ var w=weekOf(l.date); if (w>=0) activeWeeks[w]=true; });
  var progress=0, label="", sub="";
  var N=+q.target||1;
  if (q.type==="weekly"){
    var sum=0, hit=0;
    for (var w=0; w<WEEKS; w++){ var v=perWeek[w]||0; sum+=Math.min(v,N); if (v>=N) hit++; }
    progress= hit>=FINISH_WEEKS ? 1 : Math.min(.99,sum/(N*FINISH_WEEKS));
    var thisW = seasonState(TODAY)==="live" ? (perWeek[weekOf(TODAY)]||0) : 0;
    label='<b>'+Math.min(hit,FINISH_WEEKS)+'</b> of '+FINISH_WEEKS+' weeks hit';
    sub= seasonState(TODAY)==="live" ? 'This week '+fmtNum(thisW)+'/'+fmtNum(N) : fmtNum(N)+' '+esc(q.unit)+' a week';
  } else if (q.type==="steps"){
    var steps=q.steps||[], n=0; steps.forEach(function(s,i){ if (done[i]) n++; });
    progress= steps.length? n/steps.length : 0;
    label='<b>'+n+'</b> of '+steps.length+' steps';
    sub='';
  } else {
    progress=Math.min(1,total/N);
    label='<b>'+fmtNum(total)+'</b> / '+fmtNum(N)+' '+esc(q.unit);
    sub='';
  }
  var pace= seasonState(TODAY)==="pre" ? 0 : Math.min(1,(dnum(TODAY)-dnum(SEASON_START)+1)/(dnum(SEASON_END)-dnum(SEASON_START)+1));
  var cheers=S.cheers.filter(function(c){ return c.quest===q.id; }).length;
  return {progress:progress,label:label,sub:sub,perWeek:perWeek,activeWeeks:activeWeeks,wk:Object.keys(activeWeeks).length,we:weeksElapsed(TODAY),last:last,pace:pace,cheers:cheers,logs:logs,done:done,total:total};
}

/* ---------- boot ---------- */
function boot(){
  renderSeason();
  var h=(location.hash||"").replace("#",""); if (TABS.indexOf(h)>=0) S.tab=h;
  var saved=store("sq-me");
  if (saved && byId[saved]) setMe(saved); else showGate();
  S.assets=Assets;
  DB.start().then(function(k){
    setStatus(k==="local" ? "Preview mode: entries are saved on this device only." : "");
    DB.watch("quests",function(rows){ S.quests={}; rows.forEach(function(r){ if(byId[r.person]) S.quests[r.id]=r; }); S.loaded.quests=true; render(); markFinishes(); });
    DB.watch("logs",function(rows){ S.logs=rows.filter(function(r){ return r.quest && r.date; }); S.loaded.logs=true; render(); markFinishes(); });
    DB.watch("finishes",function(rows){ S.finishes={}; rows.forEach(function(r){ S.finishes[r.id]=r; }); S.loaded.finishes=true; markFinishes(); });
    DB.watch("cheers",function(rows){ S.cheers=rows; S.loaded.cheers=true; render(); });
    DB.watch("posts",function(rows){ S.posts=rows.filter(function(r){ return byId[r.person] && r.asset; }); S.loaded.posts=true; if (!(S.tab==="wall" && S.upload && S.upload.typing)) render(); });
    DB.watch("likes",function(rows){ S.likes=rows; if (S.tab==="wall") renderWallFeed(); });
    DB.watch("profiles",function(rows){ S.profiles={}; rows.forEach(function(r){ if(byId[r.id]) S.profiles[r.id]=r; }); S.loaded.profiles=true; if (S.tab!=="people" || !document.activeElement || !document.activeElement.closest || !document.activeElement.closest("#view-people")) render(); });
  });
  document.getElementById("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button[data-tab]"); if(b) setTab(b.getAttribute("data-tab"));
  });
  setInterval(function(){ var t=todayStr(); if (t!==TODAY){ TODAY=t; renderSeason(); if (!draft) render(); } },60000);
  document.getElementById("switch").addEventListener("click",function(){ store("sq-me",""); S.me=null; showGate(); });
}
/* The first time one of my quests reaches 100%, record it once. The Chat notifier listens for these. */
function markFinishes(){
  if (!S.me || !S.loaded.quests || !S.loaded.logs || !S.loaded.finishes) return;
  myQuests().forEach(function(q){
    if (S.finishes[q.id] || questStats(q).progress<1) return;
    S.finishes[q.id]={pending:true};
    DB.set("finishes",q.id,{quest:q.id,person:S.me,name:byId[S.me].name,title:q.title,cat:q.cat,at:Date.now(),date:TODAY})["catch"](function(){});
  });
}

/* ---------- season strip ---------- */
function renderSeason(){
  var st=seasonState(TODAY), big=document.getElementById("season-big"), note=document.getElementById("season-note");
  var tot=dnum(SEASON_END)-dnum(SEASON_START)+1;
  if (st==="pre"){
    var d=dnum(SEASON_START)-dnum(TODAY);
    big.textContent="Starts Monday, 2 November";
    note.textContent=d+" day"+(d===1?"":"s")+" away · 60 days to add something that stays";
  } else if (st==="live"){
    var day=dnum(TODAY)-dnum(SEASON_START)+1;
    big.textContent=(tot-day+1)+" days left";
    note.textContent="Day "+day+" of "+tot+" · week "+(weekOf(TODAY)+1)+" of "+WEEKS;
  } else { big.textContent="That's a wrap on 2026"; note.textContent="Finishers announced on 5 Jan, then the finale"; }
  document.getElementById("months").innerHTML=MONTHS.map(function(m){
    var y=+m.key.slice(0,4), mo=+m.key.slice(5,7), days=new Date(Date.UTC(y,mo,0)).getUTCDate();
    var startN=Math.max(dnum(m.key+"-01"), m.live?dnum(SEASON_START):0), endN=dnum(m.key+"-01")+days-1, f=0;
    if (!m.live) return '<div class="mseg gone" title="'+m.short+' 2026"><span>'+m.short+'</span></div>';
    if (dnum(TODAY)>endN) f=1; else if (dnum(TODAY)>=startN) f=(dnum(TODAY)-startN+1)/(endN-startN+1);
    return '<div class="mseg live'+(f===1?" past":"")+'"><div class="fill" style="width:'+(f*100)+'%"></div><span>'+m.short+'</span></div>';
  }).join("");
}

function questCard(q, opts){
  opts=opts||{};
  var p=byId[q.person], c=CATS[q.cat]||CATS.health, st=questStats(q), mine=q.person===S.me;
  var live=seasonState(TODAY)==="live";
  var weeksHtml="";
  for (var w=0; w<WEEKS; w++){
    var v=st.perWeek[w]||0, on, part=false;
    if (q.type==="weekly"){ on = v>=(+q.target||1); part = !on && v>0; }
    else on = !!st.activeWeeks[w];
    var fut = w>=st.we;
    var bg = on ? "background:"+c.color : (part ? "background:"+c.color+";opacity:.35" : "");
    weeksHtml+='<span class="wk'+(on||part?" on":"")+(fut&&!on&&!part?" future":"")+'" style="'+bg+'" title="Week '+(w+1)+'"></span>';
  }
  var cheeredToday=S.cheers.some(function(x){ return x.quest===q.id && x.from===S.me && x.date===TODAY; });
  var cheerBtn = mine
    ? '<span class="cheer done">Cheers <span class="n">'+st.cheers+'</span></span>'
    : '<button type="button" class="cheer'+(cheeredToday?" done":"")+'" data-cheer="'+esc(q.id)+'"'+(cheeredToday?' disabled':'')+'>'+(cheeredToday?"Cheered":"Cheer")+' <span class="n">'+st.cheers+'</span></button>';
  var buddy;
  if (q.buddy && byId[q.buddy]) buddy='Buddy: '+esc(first(byId[q.buddy]))+(q.buddy===S.me?' (you)':'');
  else if (mine) buddy='<select data-setbuddy="'+esc(q.id)+'" aria-label="Pick a buddy"><option value="">+ Add a buddy</option>'+ROSTER.filter(function(r){ return r.id!==S.me && !r.host; }).map(function(r){ return '<option value="'+r.id+'">'+esc(r.name)+'</option>'; }).join("")+'</select>';
  else if (byId[S.me].host) buddy='No buddy yet';
  else buddy='No buddy yet · <button type="button" class="linkbtn" data-offer="'+esc(q.id)+'">Be '+esc(first(p))+'\'s buddy</button>';
  var lastTxt;
  if (st.last){
    lastTxt = st.last.step!=null && q.steps ? 'Ticked "'+esc(q.steps[st.last.step]||"")+'" on '+fmtDate(st.last.date)
      : 'Last: +'+fmtNum(+st.last.amount)+' '+esc(q.unit)+' on '+fmtDate(st.last.date)+(st.last.note?' · '+esc(st.last.note):'');
  } else lastTxt = live ? "Nothing logged yet." : "Logging opens 2 Nov.";
  var body="";
  if (q.type==="steps"){
    body='<div class="steps'+(opts.editable?'':' ro')+'">'+(q.steps||[]).map(function(s,i){
      var d=!!st.done[i];
      return opts.editable
        ? '<label class="step'+(d?" done":"")+'"><input type="checkbox" data-step="'+i+'" data-q="'+esc(q.id)+'"'+(d?" checked":"")+(live?"":" disabled")+'><span>'+esc(s)+'</span></label>'
        : '<div class="step'+(d?" done":"")+'"><span>'+esc(s)+'</span></div>';
    }).join("")+'</div>';
  }
  var meter='<div class="meter"><div class="track"><div class="f" style="width:'+(st.progress*100)+'%;background:'+c.color+'"></div>'+(st.pace&&q.type!=="steps"?'<div class="pace" style="left:'+(st.pace*100)+'%" title="Where today sits in the season"></div>':'')+'</div>'+
    '<div class="meter-row"><span>'+st.label+'</span><span>'+(st.sub?esc(st.sub)+' · ':'')+Math.round(st.progress*100)+'%</span></div></div>';
  var weeksBlock = q.type==="steps" ? '' : '<div><div class="lbl" style="margin-bottom:5px">'+(q.type==="weekly"?'Weeks at target':'Weeks with a log')+'</div><div class="weeks">'+weeksHtml+'</div></div>';
  var quick="";
  if (opts.editable && q.type!=="steps"){
    var did="f-"+q.id;
    quick='<form class="q-quick" data-log="'+esc(q.id)+'">'+
      '<span class="lbl">'+(live?'Log progress':'Logging opens 2 Nov')+'</span>'+
      '<div class="row"><input id="'+did+'-a" type="number" min="0" step="any" inputmode="decimal" value="1" aria-label="'+esc(q.unit)+'"'+(live?'':' disabled')+'><span class="note">'+esc(q.unit)+'</span>'+
      '<input id="'+did+'-d" type="date" min="'+SEASON_START+'" max="'+(TODAY<SEASON_END?TODAY:SEASON_END)+'" value="'+(live?TODAY:SEASON_START)+'" aria-label="Date"'+(live?'':' disabled')+'></div>'+
      '<div class="row"><input id="'+did+'-n" type="text" maxlength="160" placeholder="Note or proof (optional)" aria-label="Note"'+(live?'':' disabled')+'><button class="btn" type="submit"'+(live?'':' disabled')+'>Add</button></div>'+
    '</form>';
  }
  var hist="";
  if (opts.editable && q.type!=="steps" && st.logs.length){
    var logs=st.logs.slice().sort(function(a,b){ return b.date.localeCompare(a.date)||(b.at||0)-(a.at||0); });
    hist='<details class="hist"><summary>History ('+logs.length+')</summary><div class="log-list" style="margin-top:6px">'+logs.map(function(l){
      return '<div class="log"><span class="d">'+fmtDate(l.date)+'</span><span class="t"><span class="a">+'+fmtNum(+l.amount)+'</span> '+esc(l.note||"")+'</span><button type="button" class="linkbtn" data-del="'+esc(l.id)+'">Remove</button></div>';
    }).join("")+'</div></details>';
  }
  var manage = opts.editable ? '<div class="q-actions"><button type="button" class="linkbtn" data-edit="'+esc(q.id)+'">Edit quest</button><button type="button" class="linkbtn" data-delq="'+esc(q.id)+'">Delete quest</button></div>' : '';
  return '<article class="quest'+(mine&&!opts.editable?" mine":"")+'">'+
    '<div class="q-top">'+av(p)+'<div><div class="q-who">'+esc(p.name)+(p.host?' <span class="tag host">host</span>':'')+(st.progress>=1?' <span class="tag fin">finished</span>':'')+'</div><div class="q-buddy">'+buddy+'</div></div></div>'+
    '<div class="q-title">'+esc(q.title)+'</div>'+
    (q.why?'<div class="q-why">'+esc(q.why)+'</div>':'')+
    body+meter+weeksBlock+
    (opts.editable?'':'<div class="last">'+lastTxt+'</div>')+
    quick+hist+
    '<div class="q-foot">'+cheerBtn+'<span class="cat '+c.cls+'">'+c.name+'</span></div>'+manage+
  '</article>';
}

function renderForm(el){

      '</div><div class="actions">'+(!locked&&d.steps.length<8?'<button type="button" class="linkbtn" data-addstep="1">Add a step</button>':'')+(!locked&&d.steps.length>2?'<button type="button" class="linkbtn" data-rmstep="1">Remove last step</button>':'')+'</div><span class="hint">Two to eight steps. The last one is the finish line.</span></div>';
  } else {
    measure='<div class="row3"><div class="field"><label for="q-target">4 · '+(d.type==="weekly"?'Times a week':'Target')+'</label><input id="q-target" type="number" min="1" step="any" inputmode="decimal" value="'+esc(d.target)+'"'+dis+' placeholder="'+(d.type==="weekly"?'3':'80')+'"></div>'+
      '<div class="field"><label for="q-unit">Counted in</label><input id="q-unit" maxlength="24" value="'+esc(d.unit)+'"'+dis+' placeholder="'+(d.type==="weekly"?'gym sessions, walks, lessons':'km, books, dishes')+'"></div></div>';
  }
  el.innerHTML='<div class="section-head"><h2>'+(editing?'Edit quest':'Add a quest')+'</h2><button type="button" class="ghost" data-go="ideas">Browse suggestions</button></div>'+
  '<form class="panel form" id="qform">'+
    '<div class="field"><span class="lbl">1 · Category</span><div class="catpick">'+catHtml+'</div></div>'+
    '<div class="field"><label for="q-title">2 · Your quest, in one line</label><input id="q-title" maxlength="80" value="'+esc(d.title)+'" placeholder="e.g. Gym 4 times a week"></div>'+
    '<div class="field"><span class="lbl">3 · How will you count it?</span><div class="seg">'+typeHtml+'</div><span class="hint">'+TYPES[d.type].hint+'</span></div>'+
    measure+
    (locked?'<p class="note">Progress is logged, so category, counting and target are locked. Ask Aayush if one needs changing.</p>':'')+
    '<div class="field"><label for="q-why">5 · Why this matters to you <span style="text-transform:none;letter-spacing:0">(optional, shown on the board)</span></label><textarea id="q-why" maxlength="200" placeholder="One or two lines. This is what people cheer for.">'+esc(d.why)+'</textarea></div>'+
    '<div class="field"><span class="lbl">6 · Buddy</span><div class="buddies">'+buddies+'</div><span class="hint">Your buddy checks in every Friday. If you finish, they get '+inr(BUDDY_PRIZE)+' too.'+(d.cat?' People who listed a '+CATS[d.cat].name.toLowerCase()+' skill on their profile show first.':'')+'</span></div>'+
    '<div class="actions"><button class="btn" type="submit">'+(editing?'Save changes':'Add to the board')+'</button><button type="button" class="ghost" id="q-cancel">Cancel</button><span class="msg'+(formMsg?" err":"")+'" id="q-msg">'+esc(formMsg)+'</span></div>'+
  '</form>';

    d.title=val("q-title"); d.why=val("q-why");

    else { d.target=val("q-target"); d.unit=val("q-unit"); }
  }
  form.addEventListener("click",function(e){
    var t;
    if ((t=e.target.closest("[data-cat]"))){ sync(); d.cat=t.getAttribute("data-cat"); renderForm(el); }
    else if ((t=e.target.closest("[data-type]"))){ sync(); d.type=t.getAttribute("data-type"); renderForm(el); }
    else if ((t=e.target.closest("[data-pickb]"))){ sync(); d.buddy=t.getAttribute("data-pickb"); renderForm(el); }
    else if (e.target.closest("[data-addstep]")){ sync(); d.steps.push(""); renderForm(el); }
    else if (e.target.closest("[data-rmstep]")){ sync(); d.steps.pop(); renderForm(el); }
  });

    e.preventDefault(); sync();
    if (!d.cat) return fail("Pick a category.");

    var data={person:S.me,name:byId[S.me].name,cat:d.cat,type:d.type,title:d.title.trim(),why:d.why.trim(),buddy:d.buddy||""};
    if (d.type==="steps"){
      var steps=d.steps.map(function(s){ return s.trim(); }).filter(Boolean);
      if (steps.length<2) return fail("Add at least two steps.");
      data.steps=steps; data.target=steps.length; data.unit="steps";
    } else {
      var t=parseFloat(d.target);
      if (!(t>0)) return fail("Set a number above zero.");
      if (d.type==="weekly" && t>14) return fail("Keep the weekly number to 14 or less.");
      if (!d.unit.trim()) return fail("Say what you're counting, like sessions or km.");
      data.target=t; data.unit=d.unit.trim();
    }
    var id=d.id || (S.me+"_"+Date.now());
    var prev=S.quests[id];
    if (locked && prev) ["cat","type","target","unit","steps"].forEach(function(k){ if (prev[k]!==undefined) data[k]=prev[k]; else delete data[k]; });
    data.createdAt=(prev&&prev.createdAt)||Date.now(); data.updatedAt=Date.now();
    DB.set("quests",id,data).then(function(){ var was=!!d.id; draft=null; formMsg=""; toast(was?"Quest updated":"Quest added to the board"); setTab("mine"); })["catch"](function(){ fail("Couldn't save. Check your connection and try again."); });
  };
  function fail(m){ formMsg=m; var x=document.getElementById("q-msg"); x.className="msg err"; x.textContent=m; return false; }
}

function shrinkImage(file){
  return new Promise(function(resolve){
    if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) && !/^image\//.test(file.type)) return resolve(file);
    if (file.type==="image/gif") return resolve(file);
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1800, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
      if (k===1 && file.size<2.5*1024*1024){ URL.revokeObjectURL(url); return resolve(file); }
      var cv=document.createElement("canvas"); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(function(b){ URL.revokeObjectURL(url); resolve(b||file); },"image/jpeg",0.85);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}
function pickFile(f){
  if (!f) return;
  var kind=/^video\//.test(f.type)?"video":(/^image\//.test(f.type)?"image":null);
  var u=S.upload=S.upload||{};
  u.caption=val("w-cap"); u.quest=val("w-quest");
  if (!kind){ u.err="That file type isn't supported. Use a photo or a video."; renderWall(); return; }
  if (kind==="video" && f.size>MAX_BYTES){ u.err="That video is "+(f.size/1048576).toFixed(0)+" MB. Keep clips under 20 MB: trim it or record a shorter one."; renderWall(); return; }
  if (u.preview) try{ URL.revokeObjectURL(u.preview); }catch(e){}
  u.file=f; u.kind=kind; u.preview=URL.createObjectURL(f); u.err="";
  renderWall();
}
function bindWall(){
  var fi=document.getElementById("w-file");
  if (fi) fi.onchange=function(){ pickFile(fi.files && fi.files[0]); };
  var dr=document.getElementById("w-drop");
  if (dr){
    dr.addEventListener("dragover",function(e){ e.preventDefault(); dr.classList.add("over"); });
    dr.addEventListener("dragleave",function(){ dr.classList.remove("over"); });
    dr.addEventListener("drop",function(e){ e.preventDefault(); dr.classList.remove("over"); pickFile(e.dataTransfer.files && e.dataTransfer.files[0]); });
  }
  var cl=document.getElementById("w-clear");
  if (cl) cl.onclick=function(){ var u=S.upload; u.caption=val("w-cap"); u.quest=val("w-quest"); if (u.preview) try{ URL.revokeObjectURL(u.preview); }catch(e){} u.file=null; u.preview=null; renderWall(); };
  var cap=document.getElementById("w-cap");
  if (cap){ cap.onfocus=function(){ (S.upload=S.upload||{}).typing=true; }; cap.onblur=function(){ if (S.upload) S.upload.typing=false; }; }

    e.preventDefault();

    u.caption=val("w-cap").trim(); u.quest=val("w-quest"); u.busy=true; u.err=""; u.typing=false; renderWall();
    var prep = u.kind==="image" ? shrinkImage(u.file) : Promise.resolve(u.file);
    prep.then(function(blob){
      if (blob.size>MAX_BYTES) throw {code:"too_large"};
      return S.assets.upload(blob,u.kind);
    }).then(function(r){
      var id=S.me+"_"+Date.now();
      return DB.set("posts",id,{person:S.me,name:byId[S.me].name,quest:u.quest||"",caption:u.caption.slice(0,140),asset:r.id,url:r.url,kind:u.kind,at:Date.now(),date:TODAY});
    }).then(function(){
      if (u.preview) try{ URL.revokeObjectURL(u.preview); }catch(e){}
      S.upload=null; toast("Posted to the wall"); renderWall();
    })["catch"](function(err){
      var code=err&&err.code;
      u.busy=false;
      u.err = code==="too_large" ? "That file is over 20 MB. Trim it or pick a smaller one."
        : code==="unsupported_type" ? "That format isn't supported. Try a JPG, PNG or MP4."
        : code==="quota_or_state" ? "The board's storage is full. Tell Aayush."
        : code==="rate_limited" ? "Too many uploads at once. Wait a minute and try again."
        : code==="not_granted" ? "The board refused that upload. Use a photo, or a video under 20 MB."
        : "Upload failed. Check your connection and try again.";
      renderWall();
    });
  };
}

    return;
  }
  if ((t=e.target.closest("[data-wcat]"))){ S.wcat=t.getAttribute("data-wcat"); renderWall(); return; }
  if ((t=e.target.closest("[data-wsort]"))){ S.wsort=t.getAttribute("data-wsort"); renderWall(); return; }
  if ((t=e.target.closest("[data-like]"))){
    var pid=t.getAttribute("data-like"), lid=pid+"_"+S.me;
    var has=S.likes.some(function(l){ return l.id===lid; });
    (has ? DB.del("likes",lid) : DB.set("likes",lid,{post:pid,from:S.me,at:Date.now()}))["catch"](function(){ toast("Couldn't save that like."); });
    return;
  }
  if ((t=e.target.closest("[data-delpost]"))){
    var dp=t.getAttribute("data-delpost"), post=S.posts.filter(function(x){ return x.id===dp; })[0];
    if (t.getAttribute("data-armed")){
      DB.del("posts",dp).then(function(){
        if (post && S.assets) S.assets["delete"](post.asset)["catch"](function(){});
        S.likes.filter(function(l){ return l.post===dp; }).forEach(function(l){ DB.del("likes",l.id)["catch"](function(){}); });
        toast("Post deleted");
      });
    } else arm(t,"Confirm delete","Delete");
    return;
  }
  if ((t=e.target.closest("[data-rmskill]"))){
    var sk=skillsOf(S.me).slice(); sk.splice(+t.getAttribute("data-rmskill"),1);
    saveProfile({skills:sk}).then(function(){ toast("Skill removed"); }); return;
  }
  if ((t=e.target.closest("[data-pcat]"))){ S.pcat=t.getAttribute("data-pcat"); renderPeople(); return; }
  if ((t=e.target.closest("[data-buddywith]"))){ startDraft({buddy:t.getAttribute("data-buddywith"),cat:t.getAttribute("data-bcat")||""}); return; }
  if ((t=e.target.closest("[data-offer]"))){
    var oq=S.quests[t.getAttribute("data-offer")]; if (!oq || oq.buddy) return;
    DB.set("quests",oq.id,Object.assign({},stripId(oq),{buddy:S.me,updatedAt:Date.now()})).then(function(){ toast("You're "+first(byId[oq.person])+"'s buddy"); })["catch"](function(){ toast("Couldn't save that."); });
    return;
  }
  if ((t=e.target.closest("[data-cheer]")) && !t.disabled){
    var cq=S.quests[t.getAttribute("data-cheer")]; if (!cq) return; t.disabled=true;
    DB.set("cheers",cq.id+"_"+S.me+"_"+TODAY,{quest:cq.id,owner:cq.person,from:S.me,date:TODAY,at:Date.now()})
      .then(function(){ toast("Cheered "+first(byId[cq.person])); })["catch"](function(){ t.disabled=false; toast("Couldn't save that cheer."); });
    return;
  }
  if ((t=e.target.closest("[data-del]"))){
    if (t.getAttribute("data-armed")) DB.del("logs",t.getAttribute("data-del")).then(function(){ toast("Entry removed"); });
    else arm(t,"Confirm remove","Remove");
  }
});
function arm(btn,on,off){ btn.setAttribute("data-armed","1"); btn.textContent=on; setTimeout(function(){ if(btn.isConnected){ btn.removeAttribute("data-armed"); btn.textContent=off; } },3000); }

function stripId(q){ var o=Object.assign({},q); delete o.id; return o; }
document.addEventListener("change",function(e){
  var sb=e.target.closest("select[data-setbuddy]");
  if (sb){ var bq=S.quests[sb.getAttribute("data-setbuddy")]; if (bq && sb.value){ DB.set("quests",bq.id,Object.assign({},stripId(bq),{buddy:sb.value,updatedAt:Date.now()})).then(function(){ toast(first(byId[sb.value])+" is your buddy"); }); } return; }
  var cb=e.target.closest("input[data-step]"); if (!cb) return;
  var qid=cb.getAttribute("data-q"), i=+cb.getAttribute("data-step"), q=S.quests[qid]; if (!q) return;
  var docId=qid+"_step"+i;
  if (cb.checked) DB.set("logs",docId,{quest:qid,person:S.me,step:i,date:(TODAY>SEASON_END?SEASON_END:TODAY),at:Date.now()}).then(function(){ toast("Step done: "+q.steps[i]); });
  else DB.del("logs",docId);
});

document.addEventListener("submit",function(e){
  var f=e.target.closest("form[data-log]"); if (!f) return;
  e.preventDefault();
  var qid=f.getAttribute("data-log"), q=S.quests[qid], base="f-"+qid;
  var amt=parseFloat(val(base+"-a")), date=val(base+"-d"), note=val(base+"-n").trim();
  if (!(amt>0)) return toast("Enter an amount above zero.");
  if (!date || date<SEASON_START || date>TODAY || date>SEASON_END) return toast("Pick a date inside the season, up to today.");
  DB.set("logs",qid+"_"+Date.now(),{quest:qid,person:S.me,amount:amt,date:date,note:note.slice(0,160),at:Date.now()})
    .then(function(){ toast("Logged +"+fmtNum(amt)+" "+q.unit); })["catch"](function(){ toast("Couldn't save. Check your connection and try again."); });
});

boot();
})();
</script>

</body></html>
